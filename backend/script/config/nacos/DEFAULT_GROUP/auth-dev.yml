# 安全配置
security:
  # 验证码
  captcha:
    # 是否开启验证码
    enabled: true
    # 验证码类型 math 数组计算 char 字符验证
    type: CHAR
    # line 线段干扰 circle 圆圈干扰 shear 扭曲干扰
    category: SHEAR
    # 数字验证码位数
    numberLength: 1
    # 字符验证码长度
    charLength: 4

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# 三方授权
justauth:
  # 前端外网访问地址
  address: https://auth.example.invalid/etc2-html/cloudAuthPlatform/index.html#
  type:
    wechat_enterprise_cloudauth:
      # 企业微信
      server-url: https://auth.example.invalid:8075
      client-id: REPLACE_WITH_CLIENT_ID
    maxkey:
      # maxkey 服务器地址
      # 注意 如下均配置均不需要修改 maxkey 已经内置好了数据
      server-url: http://sso.maxkey.top
      client-id: REPLACE_WITH_CLIENT_ID
      client-secret: REPLACE_WITH_CLIENT_SECRET
      redirect-uri: ${justauth.address}/social-callback?source=maxkey
    topiam:
      # topiam 服务器地址
      server-url: http://127.0.0.1:1989/api/v1/authorize/y0q************spq***********8ol
      client-id: REPLACE_WITH_CLIENT_ID
      client-secret: REPLACE_WITH_CLIENT_SECRET
      redirect-uri: ${justauth.address}/social-callback?source=topiam
      scopes: [ openid, email, phone, profile ]
    qq:
      client-id: REPLACE_WITH_CLIENT_ID
      client-secret: REPLACE_WITH_CLIENT_SECRET
      redirect-uri: ${justauth.address}/social-callback?source=qq
      union-id: false
