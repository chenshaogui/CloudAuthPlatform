server:
  undertow:
    max-http-post-size: -1
    buffer-size: 512
    direct-buffers: true
    threads:
      io: 4
      worker: 48

spring:
  threads:
    virtual:
      enabled: false
  task:
    execution:
      thread-name-prefix: async-
      mode: force
  messages:
    basename: i18n/messages_zh_CN
    encoding: UTF-8
  servlet:
    multipart:
      max-request-size: 20MB
      max-file-size: 10MB
  mvc:
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      INDENT_OUTPUT: false
      fail_on_empty_beans: false
    deserialization:
      fail_on_unknown_properties: false
  bus:
    id: ${spring.application.name}
    base-packages: io.gitee.chenshaogui.cloudauth.**.event
  rabbitmq:
    host: localhost
    port: 5672
    username: REPLACE_WITH_USERNAME
    password: REPLACE_WITH_PASSWORD
  data:
    redis:
      host: ${redis.host}
      port: 6379
      password: 123456
      database: 4
      timeout: 10000
      ssl.enabled: false

redisson:
  keyPrefix:
  threads: 4
  nettyThreads: 8
  singleServerConfig:
    clientName: ${spring.application.name}
    connectionMinimumIdleSize: 8
    connectionPoolSize: 32
    idleConnectionTimeout: 10000
    timeout: 3000
    subscriptionConnectionPoolSize: 50

lock4j:
  acquire-timeout: 3000
  expire: 30000

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/${spring.application.name}/console.log

logging:
  level:
    org.springframework: warn
    org.mybatis.spring.mapper: error
    org.apache.fury: warn
    io.micrometer: error
    org.springframework.context.support.PostProcessorRegistrationDelegate: error
  config: classpath:logback-plus.xml

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  check-same-token: false
  is-concurrent: true
  is-share: false
  jwt-secret-key: abcdefghijklmnopqrstuvwxyz

mybatis-plus:
  enableLogicDelete: true
  mapperPackage: io.gitee.chenshaogui.cloudauth.**.mapper
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  typeAliasesPackage: io.gitee.chenshaogui.cloudauth.**.domain
  global-config:
    dbConfig:
      idType: ASSIGN_ID

mybatis-encryptor:
  enable: false
  algorithm: BASE64
  encode: BASE64
  password:
  publicKey:
  privateKey:

api-decrypt:
  enabled: true
  headerFlag: encrypt-key
  publicKey: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAJnNwrj4hi/y3CCJu868ghCG5dUj8wZK++RNlTLcXoMmdZWEQ/u02RgD5LyLAXGjLOjbMtC+/J9qofpSGTKSx/MCAwEAAQ==
  privateKey: 

xss:
  enabled: true
  excludeUrls:
    - /system/notice

springdoc:
  api-docs:
    enabled: true
  info:
    title: 'cloud-auth-platform 单体 PoC'
    description: 'auth/system/resource 合并单体，本地文件配置，无 Nacos/Dubbo'
    version: '2.5.1'
    contact:
      name: ChenShaoGui
      email: REPLACE_WITH_EMAIL
      url: https://gitee.com/chenshaogui/cloud-auth-platform

seata:
  enabled: false
  application-id: ${spring.application.name}
  tx-service-group: ${spring.application.name}-group
  config:
    type: file
  registry:
    type: file
  enable-auto-data-source-proxy: false

tenant:
  enable: true
  excludes:
    - sys_menu
    - sys_area
    - sys_tenant
    - sys_tenant_package
    - sys_role_dept
    - sys_role_menu
    - sys_user_post
    - sys_user_role
    - sys_client
    - sys_oss_config
    - flow_spel

project:
  client-admin-menuIds: 1,100,1001,1003,101,1008,1009,1010,1011,1012,123,1061,1062,1063,1064,1065,134,2001551332223283201,2001550621456527362,2001551038227738626,2001552371659894785,2001552463775199234
